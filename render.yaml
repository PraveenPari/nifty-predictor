# Render Blueprint — free hosting for Nifty Predictor Pro
# Push this repo, then Render Dashboard → New → Blueprint → select repo.
# Free domain: https://<service>.onrender.com (HTTPS included)
services:
  - type: web
    name: nifty-predictor
    runtime: python
    rootDir: nifty-predictor-python
    plan: free
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: gunicorn -c gunicorn.conf.py app:app
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GUNICORN_WORKERS
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      # --- Set these in Render Dashboard → Environment (secret values) ---
      - key: BREEZE_API_KEY
        sync: false
      - key: BREEZE_SECRET_KEY
        sync: false
      - key: BREEZE_SESSION_TOKEN
        sync: false
      - key: ANGEL_ONE_API_KEY
        sync: false
      - key: ANGEL_ONE_CLIENT_ID
        sync: false
      - key: ANGEL_ONE_PASSWORD
        sync: false
      - key: ANGEL_ONE_TOTP_SECRET
        sync: false
